name: Update Data and Deploy

on:
  schedule:
    # Run daily at 8:00 AM UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'get_github_stars.R'
      - '.github/workflows/update-and-deploy.yml'

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINY_ACCOUNT: ${{ secrets.SHINY_ACCOUNT }}
      SHINY_TOKEN: ${{ secrets.SHINY_TOKEN }}
      SHINY_SECRET: ${{ secrets.SHINY_SECRET }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      
      - name: Install R packages
        run: |
          install.packages(c(
            "rsconnect", "automagic", "gh", "magrittr", "purrr", 
            "tibble", "dplyr", "qs", "fs", "lubridate", "stringr",
            "shiny", "shinycustomloader", "reactable", "formattable", 
            "bslib", "htmltools"
          ))
        shell: Rscript {0}
      
      - name: Update GitHub Stars Data
        run: |
          cat("Fetching GitHub stars data...\n")
          source("get_github_stars.R")
          cat("Data update completed successfully!\n")
        shell: Rscript {0}
      
      - name: Commit and push updated data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/*.qs app/data/*.qs
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub stars data [skip ci]"
            git push
          fi
      
      - name: Deploy to shinyapps.io
        if: env.SHINY_ACCOUNT != '' && env.SHINY_TOKEN != '' && env.SHINY_SECRET != ''
        run: |
          cat("Deploying to shinyapps.io...\n")
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINY_ACCOUNT"), 
            token = Sys.getenv("SHINY_TOKEN"), 
            secret = Sys.getenv("SHINY_SECRET")
          )
          rsconnect::deployApp(
            appDir = "app",
            appName = "jimsghstars",
            appTitle = "JIMBRIG'S GITHUB STARRED REPOS",
            forceUpdate = TRUE
          )
          cat("Deployment completed successfully!\n")
        shell: Rscript {0}
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.SHINY_ACCOUNT }}" != "" ]; then
            echo "- **Deployed to**: shinyapps.io" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Note**: Deployment skipped (credentials not configured)" >> $GITHUB_STEP_SUMMARY
          fi
